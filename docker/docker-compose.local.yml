# 시작: docker compose -f docker/docker-compose.local.yml up -d
# 종료: docker compose -f docker/docker-compose.local.yml stop
# 전체 삭제(볼륨 포함): docker compose -f docker/docker-compose.local.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: moongcheap-postgres-local
    environment:
      POSTGRES_DB: moongcheap
      POSTGRES_USER: moongcheap
      POSTGRES_PASSWORD: moongcheap
    ports:
      - "5432:5432"
    volumes:
      - moongcheap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moongcheap -d moongcheap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moongcheap-redis-local
    ports:
      - "6379:6379"
    volumes:
      - moongcheap-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: moongcheap-opensearch-local
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Moongcheap!2024
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - moongcheap-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  moongcheap-postgres-data:
  moongcheap-redis-data:
  moongcheap-opensearch-data:
