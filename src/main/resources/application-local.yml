logging:
  level:
    org.flywaydb: DEBUG

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/moongcheap
    username: moongcheap
    password: moongcheap
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

opensearch:
  host: localhost
  port: 9200
  scheme: http
  auto-create-indices: true

server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: false

moongcheap:
  cors:
    allowed-origins: "http://localhost:3000"
  oauth:
    redirect-base-url: "http://localhost:3000"
  security:
    encryption:
      password: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      salt: "0123456789abcdef0123456789abcdef"
  oauth2:
    kakao:
      admin-key: "${KAKAO_ADMIN_KEY:}"

spring.security.oauth2.client.registration:
  kakao:
    client-id: "${KAKAO_CLIENT_ID:local-kakao-client-id}"
    client-secret: "${KAKAO_CLIENT_SECRET:local-kakao-client-secret}"
    client-authentication-method: client_secret_post
    authorization-grant-type: authorization_code
    redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
    scope: profile_nickname, account_email
    client-name: Kakao
  google:
    client-id: "${GOOGLE_CLIENT_ID:local-google-client-id}"
    client-secret: "${GOOGLE_CLIENT_SECRET:local-google-client-secret}"
    scope: profile, email

spring.security.oauth2.client.provider:
  kakao:
    authorization-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    user-name-attribute: id
