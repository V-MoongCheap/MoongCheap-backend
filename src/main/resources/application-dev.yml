spring:
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/moongcheap}"
    username: "${DB_USERNAME:moongcheap}"
    password: "${DB_PASSWORD:moongcheap}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 30000
      connection-init-sql: "SET idle_in_transaction_session_timeout = '60000'"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"

server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

moongcheap:
  batch:
    demand-expire:
      cron: "0 * * * * *"
    demand-board-cancel:
      cron: "0 * * * * *"
  group-buy:
    outbox-publish-delay-ms: 1000
    order-consume-delay-ms: 1000
    judgment-poll-delay-ms: 10000
  cors:
    allowed-origins: "${ALLOWED_ORIGINS:http://localhost:3000}"
  oauth:
    redirect-base-url: "${OAUTH_REDIRECT_BASE_URL:http://localhost:3000}"
  security:
    internal-api-key-bypass: true
    encryption:
      password: "${MOONGCHEAP_ENC_PASSWORD:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      salt: "${MOONGCHEAP_ENC_SALT:0123456789abcdef0123456789abcdef}"

spring.security.oauth2.client.registration:
  kakao:
    client-id: "${KAKAO_CLIENT_ID:local-kakao-client-id}"
    client-secret: "${KAKAO_CLIENT_SECRET:local-kakao-client-secret}"
    client-authentication-method: client_secret_post
    authorization-grant-type: authorization_code
    redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
    scope: profile_nickname, account_email
    client-name: Kakao
  google:
    client-id: "${GOOGLE_CLIENT_ID:local-google-client-id}"
    client-secret: "${GOOGLE_CLIENT_SECRET:local-google-client-secret}"
    scope: profile, email

spring.security.oauth2.client.provider:
  kakao:
    authorization-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    user-name-attribute: id

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: DEBUG
    com.moongcheap_backend: INFO
