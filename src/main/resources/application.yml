spring:
  application:
    name: MoongCheap_backend
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 20

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: Asia/Seoul
        jdbc.batch_size: 20
        order_inserts: true
        order_deletes: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  servlet:
    session:
      cookie:
        name: SID
        http-only: true
        secure: true
        same-site: lax
        path: /

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    with-credentials: true
  default-produces-media-type: application/json

resilience4j:
  retry:
    retry-aspect-order: 0
    instances:
      chunkRetry:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.DataAccessResourceFailureException
  circuitbreaker:
    instances:
      opensearch:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        record-failure-predicate: com.moongcheap_backend.common.config.OpenSearchFailurePredicate

moongcheap:
  batch:
    demand-expire:
      cron: "0 5 * * * *"
    demand-board-cancel:
      cron: "0 5 * * * *"
  group-buy:
    # PENDING Outbox의 Redis 발행 주기와 만료 판정 대상 조회 주기
    outbox-publish-delay-ms: 1000
    judgment-poll-delay-ms: 10000
  security:
    session:
      absolute-ttl-default: 24h
      absolute-ttl-remember-me: 14d
    login-failure:
      max-attempts: 5
      lock-duration: 10m
    encryption:
      # 64자 hex 문자열(32바이트) 권장. 프로파일별 파일에서 오버라이드
      password: "${MOONGCHEAP_ENC_PASSWORD:}"
      salt: "${MOONGCHEAP_ENC_SALT:}"
