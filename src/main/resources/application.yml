spring:
  application:
    name: MoongCheap_backend
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 20

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: Asia/Seoul
        jdbc.batch_size: 20
        order_inserts: true
        order_deletes: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  servlet:
    session:
      cookie:
        name: SID
        http-only: true
        secure: true
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    with-credentials: true
  default-produces-media-type: application/json

resilience4j:
  retry:
    retry-aspect-order: 0
    instances:
      chunkRetry:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.DataAccessResourceFailureException
  circuitbreaker:
    instances:
      opensearch:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        record-failure-predicate: com.moongcheap_backend.common.config.OpenSearchFailurePredicate

moongcheap:
  payments:
    queue:
      enabled: ${PAYMENT_QUEUE_ENABLED:false}
      workers: 1
      poll-delay-ms: 1000
      visibility-delay: 60s
      lease: 60s
      outbox-publish-delay-ms: 1000
      recovery-delay-ms: 5000
      batch-size: 100
      max-attempts: 5
      replay-window: 14d
      shutdown-wait: 15s
    brand-pay:
      # 브랜드페이 서버 API의 기본 주소
      base-url: "https://api.tosspayments.com"
      # 브라우저에서 브랜드페이 SDK를 초기화할 때 사용하는 공개 키
      client-key: "${TOSS_BRANDPAY_CLIENT_KEY:}"
      # 토큰 발급에 사용하는 서버 전용 시크릿 키. 저장소에 실제 값을 커밋하지 않는다.
      secret-key: "${TOSS_BRANDPAY_SECRET_KEY:}"
      # 웹훅 서명 검증 등에 사용하는 서버 전용 보안 키. 클라이언트에 노출하지 않는다.
      security-key: "${TOSS_BRANDPAY_SECURITY_KEY:}"
  batch:
    demand-expire:
      cron: "0 5 * * * *"
    demand-board-cancel:
      cron: "0 5 * * * *"
  group-buy:
    # PENDING Outbox 발행, 주문 Stream 소비, 만료 판정 대상 조회 주기
    outbox-publish-delay-ms: 1000
    order-consume-delay-ms: 1000
    judgment-poll-delay-ms: 10000
  security:
    # 환경 명칭
    active-env: "test"
    session:
      absolute-ttl-default: 24h
      absolute-ttl-remember-me: 14d
    login-failure:
      max-attempts: 5
      lock-duration: 10m
    encryption:
      # 64자 hex 문자열(32바이트) 권장. 프로파일별 파일에서 오버라이드
      password: "${MOONGCHEAP_ENC_PASSWORD:hlNdwmESwJz11xZdpyAaadY7JOkB9qdo}"
      salt: "${MOONGCHEAP_ENC_SALT:dc3eee6f931d5dd91c5a8516716caa4e}"
    # 내부 API 인증 키. 추후 AWS Parameter Store로 관리 예정
    internal-api-key: "${MOONGCHEAP_INTERNAL_API_KEY:}"
  time:
    # 시각 5분 단위 올림(TimeUtils.ceilToFiveMinuteMark) 우회 스위치
    # true 로 두면 원본 시각 그대로 사용 (테스트/디버깅 용도)
    ceil-bypass: false
